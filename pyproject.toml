[project]
name = "unified-microsoft-mcp"
version = "1.1.0"
description = "Unified Microsoft MCP Server combining Azure CLI and Microsoft Graph API tools"
authors = [{name = "JackInSightsV2"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.7,<3",
    "azure-identity>=1.15,<2",
    "httpx>=0.25,<1",
    "starlette>=0.35,<2",
    "fastapi>=0.109,<1",
    "uvicorn>=0.27,<1",
    "tomlkit>=0.12,<1",
    # The Azure CLI (az), so azure_read/azure_write and AKS work without a separate install.
    "azure-cli>=2.90,<3",
    # azure-cli pins these pre-releases. uv installs a pre-release only when a direct
    # requirement names one, so they are repeated here with the same pre-release floor.
    # When raising the azure-cli floor, copy its pre-release pins (pip show -v azure-cli).
    "azure-batch>=15.0.0b1",
    "azure-keyvault-administration>=4.8.0b2",
    "azure-keyvault-keys>=4.12.0b2",
    "azure-keyvault-securitydomain>=1.0.0b1",
    "azure-mgmt-appconfiguration>=6.0.0b2",
    "azure-mgmt-authorization>=5.0.0b2",
    "azure-mgmt-batchai>=7.0.0b1",
    "azure-mgmt-botservice>=2.0.0b3",
    "azure-mgmt-cognitiveservices>=15.0.0b4",
    "azure-mgmt-containerinstance>=10.2.0b1",
    "azure-mgmt-containerregistry>=15.1.0b2",
    "azure-mgmt-containerregistrytasks>=1.0.0b1",
    "azure-mgmt-datalake-store>=1.1.0b1",
    "azure-mgmt-domainregistration>=1.0.0b1",
    "azure-mgmt-eventgrid>=10.2.0b2",
    "azure-mgmt-eventhub>=12.0.0b1",
    "azure-mgmt-extendedlocation>=1.0.0b2",
    "azure-mgmt-hdinsight>=9.1.0b2",
    "azure-mgmt-iotcentral>=10.0.0b1",
    "azure-mgmt-iothub>=5.0.0b1",
    "azure-mgmt-loganalytics>=13.0.0b4",
    "azure-mgmt-monitor>=7.0.0b1",
    "azure-mgmt-mysqlflexibleservers>=1.1.0b3",
    "azure-mgmt-policyinsights>=1.1.0b4",
    "azure-mgmt-postgresqlflexibleservers>=3.0.0b2",
    "azure-mgmt-rdbms>=10.2.0b17",
    "azure-mgmt-resource-deployments>=1.0.0b1",
    "azure-mgmt-resource-deploymentscripts>=1.0.0b1",
    "azure-mgmt-resource-templatespecs>=1.0.0b1",
    "azure-mgmt-servicebus>=10.0.0b1",
    "azure-mgmt-servicefabricmanagedclusters>=2.1.0b3",
    "azure-mgmt-servicelinker>=1.2.0b3",
    "azure-mgmt-signalr>=2.0.0b2",
    "azure-mgmt-sql>=4.0.0b22",
    "azure-mgmt-sqlvirtualmachine>=1.0.0b5",
    "azure-mgmt-synapse>=2.1.0b5",
    "azure-storage-blob>=12.29.0b1",
    "azure-storage-file-datalake>=12.24.0b1",
    "azure-storage-file-share>=12.25.0b1",
    "azure-storage-queue>=12.16.0b1",
    "microsoft-security-utilities-secret-masker>=1.0.0b4",
]

[project.urls]
Homepage = "https://github.com/JackInSightsV2/Azure-M365-MCP"
Repository = "https://github.com/JackInSightsV2/Azure-M365-MCP"

[project.scripts]
unified-microsoft-mcp = "unified_mcp.main:run"
unified-microsoft-mcp-bootstrap-spn = "unified_mcp.bootstrap:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-mock>=3.12,<4",
    "pytest-cov>=5,<8",
    "black>=24,<27",
    "ruff>=0.12,<1",
    "mypy>=2.3.0,<3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unified_mcp*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "docker: marks tests that start Docker Compose",
]
